---
name: Release

"on":
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable tag to release, for example v0.1.0.
        required: true
        type: string

permissions:
  contents: read

jobs:
  artifact:
    uses: Novirmor/cvp-cicd/.github/workflows/artifact.yml@841fab16fcdd432f0e1e8980a41be557d8d9849a # main
    with:
      artifact-name: appmanifest-${{ inputs.tag }}-dist
      artifact-path: dist/*
      ref: ${{ inputs.tag }}
    permissions:
      contents: read

  release:
    needs: artifact
    uses: Novirmor/cvp-cicd/.github/workflows/release.yml@841fab16fcdd432f0e1e8980a41be557d8d9849a # main
    with:
      release-tag: ${{ inputs.tag }}
      source-artifact-name: appmanifest-${{ inputs.tag }}-dist
    permissions:
      contents: write
