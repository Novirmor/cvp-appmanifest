---
version: "3"

tasks:
  default:
    cmds: [task: lint]

  lint:
    desc: Run every quality gate
    cmds:
      - pre-commit run --all-files

  test:
    desc: Run Go unit, black-box, and race tests
    cmds:
      - go test -race ./...

  security:
    desc: Scan Git history, GitHub Actions security posture, and Go dependencies
    cmds:
      - gitleaks git --redact --no-banner --baseline-path .gitleaks-baseline.json .
      - zizmor .github/workflows
      - govulncheck ./...

  build:
    desc: Build the appmanifest CLI
    cmds:
      - go build -o dist/appmanifest ./cmd/appmanifest

  artifact:
    desc: Build reproducible release artifacts, schema assets, and checksums
    cmds:
      - |
        set -euo pipefail
        rm -rf dist
        mkdir -p dist
        for target in "linux/amd64" "linux/arm64" "darwin/amd64" "darwin/arm64" "windows/amd64"; do
          os="${target%%/*}"
          arch="${target##*/}"
          ext=""
          [ "$os" = "windows" ] && ext=".exe"
          name="appmanifest_${os}_${arch}${ext}"
          CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
            go build -trimpath -ldflags "-s -w -X main.version={{.VERSION}} -X main.commit={{.COMMIT}}" \
            -o "dist/$name" ./cmd/appmanifest
         done
         cp schema/v1alpha1/appmanifest.schema.json dist/appmanifest.schema.json
         cp schema/v1alpha2/appmanifest.schema.json dist/appmanifest.v1alpha2.schema.json
         (cd dist && sha256sum appmanifest* > SHA256SUMS)

  release:
    desc: Verify artifacts and print the release summary (tagging is manual)
    cmds:
      - |
        set -euo pipefail
        if [ -f dist/SHA256SUMS ]; then
          (cd dist && sha256sum -c SHA256SUMS)
        else
          echo "No local dist/: the release workflow verifies the built artifact's SHA256SUMS."
        fi
        echo "Create the immutable tag and GitHub Release through the release workflow."
